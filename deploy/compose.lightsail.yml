name: canvas-to-do

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:5000
  AllowedHosts: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env};www.${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
  ConnectionStrings__CanvasToDo: Host=postgres;Port=5432;Database=${POSTGRES_DB:-incos_workspace};Username=${POSTGRES_USER:-incos};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env};Maximum Pool Size=15;Minimum Pool Size=0;Timeout=5;Command Timeout=30;Keepalive=30
  Database__EnsureCreated: "true"
  Database__MigrateAuth: "true"
  ReverseProxy__TrustForwardedHeaders: "true"
  Performance__MemoryCacheSizeMb: ${API_MEMORY_CACHE_MB:-16}
  Authentication__Admin__BootstrapEmail: ${AUTH_ADMIN_BOOTSTRAP_EMAIL:-}
  Authentication__Admin__BootstrapPassword: ${AUTH_ADMIN_BOOTSTRAP_PASSWORD:-}
  Authentication__Admin__BootstrapDisplayName: ${AUTH_ADMIN_BOOTSTRAP_DISPLAY_NAME:-Administrator}
  Authentication__SessionHours: ${AUTH_SESSION_HOURS:-168}
  Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
  Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
  Authentication__Google__CallbackPath: /api/auth/google/oauth-callback
  Authentication__Facebook__ClientId: ${FACEBOOK_CLIENT_ID:-}
  Authentication__Facebook__ClientSecret: ${FACEBOOK_CLIENT_SECRET:-}
  Authentication__Facebook__CallbackPath: /api/auth/facebook/oauth-callback
  Email__PublicFrontendBaseUrl: https://${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
  Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
  Email__FromName: ${EMAIL_FROM_NAME:-Canvas To Do}
  Email__Smtp__Host: ${SMTP_HOST:-}
  Email__Smtp__Port: ${SMTP_PORT:-587}
  Email__Smtp__Username: ${SMTP_USERNAME:-}
  Email__Smtp__Password: ${SMTP_PASSWORD:-}
  Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
  Email__Smtp__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-15}
  Email__Development__ExposeTokens: "false"
  Authentication__Canvas__AllowedInstanceUrls: ${CANVAS_ALLOWED_INSTANCE_URLS:-https://sfu.instructure.com,https://canvas.ubc.ca,https://canvas.usask.ca,https://canvas.uw.edu,https://canvas.stanford.edu,https://canvas.harvard.edu,https://q.utoronto.ca,https://bruinlearn.ucla.edu,https://bcourses.berkeley.edu,https://canvas.it.umich.edu,https://canvas.illinois.edu,https://canvas.umn.edu,https://canvas.virginia.edu,https://canvas.colorado.edu,https://canvas.upenn.edu,https://login.canvas.cornell.edu,https://etl.snu.ac.kr,https://lms.korea.ac.kr,https://icampus.skku.edu,https://canvas.suwon.ac.kr}
  Authentication__Canvas__OAuth__Enabled: ${CANVAS_OAUTH_ENABLED:-false}
  Authentication__Canvas__OAuth__ClientId: ${CANVAS_OAUTH_CLIENT_ID:-}
  Authentication__Canvas__OAuth__ClientSecret: ${CANVAS_OAUTH_CLIENT_SECRET:-}
  Authentication__Canvas__OAuth__CallbackUrl: ${CANVAS_OAUTH_CALLBACK_URL:-}
  Authentication__Canvas__ManualTokenEnabled: ${CANVAS_MANUAL_TOKEN_ENABLED:-false}
  DataProtection__KeysPath: /var/lib/canvas-to-do/data-protection-keys
  # Workstation GC favors a lower memory footprint on the 1 GB deployment tier.
  DOTNET_gcServer: "0"
  DOTNET_EnableDiagnostics: "0"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incos_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-incos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    command:
      - postgres
      - -c
      - max_connections=25
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 64mb
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.75

  migrate:
    image: canvas-to-do-api:local
    build:
      context: ..
      dockerfile: backend/CanvasToDo.Api/Dockerfile
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--migrate-only"]
    environment:
      <<: *api-environment
      Database__InitializeOnStartup: "true"
    volumes:
      - data-protection-keys:/var/lib/canvas-to-do/data-protection-keys
    networks:
      - database
      - application
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  api:
    <<: *service-defaults
    image: canvas-to-do-api:local
    build:
      context: ..
      dockerfile: backend/CanvasToDo.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      Database__InitializeOnStartup: "false"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - data-protection-keys:/var/lib/canvas-to-do/data-protection-keys
    networks:
      - database
      - application
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    stop_grace_period: 20s
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 1.0

  frontend:
    <<: *service-defaults
    image: canvas-to-do-frontend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=8m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25

networks:
  database:
    internal: true
  application:

volumes:
  postgres-data:
    # Explicit names prevent a Compose project rename from silently creating an
    # empty database during future deployments.
    name: canvas-to-do-postgres-data
  data-protection-keys:
    name: canvas-to-do-data-protection-keys
