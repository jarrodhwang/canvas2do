services:
  postgres:
    image: postgres:18
    container_name: incos-workspace-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: incos_workspace
      POSTGRES_USER: incos
      POSTGRES_PASSWORD: incos123
    ports:
      - "6060:5432"
    volumes:
      - incos-postgres-data-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incos -d incos_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Incos.Workspace.Api/Dockerfile.dev
    container_name: incos-workspace-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6272
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__IncosWorkspace: Host=postgres;Port=5432;Database=incos_workspace;Username=incos;Password=incos123
      Database__EnsureCreated: "true"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Google__HostedDomain: ${GOOGLE_WORKSPACE_DOMAIN:-incos.co.kr}
      Authentication__Google__WorkspaceDataDomain: ${GOOGLE_WORKSPACE_DOMAIN:-incos.co.kr}
      Authentication__Google__RestrictToHostedDomain: "true"
      Authentication__Google__CallbackPath: /signin-google
      Authentication__Canvas__InstanceUrl: ${CANVAS_INSTANCE_URL:-}
      Authentication__Canvas__AccessToken: ${CANVAS_ACCESS_TOKEN:-}
      DataProtection__KeysPath: /var/lib/incos-workspace/data-protection-keys
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Authentication__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      Authentication__Microsoft__TenantId: ${MICROSOFT_TENANT_ID:-common}
    ports:
      - "6272:6272"
    volumes:
      - .:/workspace
      - incos-data-protection-keys-dev:/var/lib/incos-workspace/data-protection-keys
      - incos-nuget-cache-dev:/root/.nuget/packages
      - incos-static-images-dev:/var/www/incos-static/images

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: incos-workspace-frontend-dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:6272
    volumes:
      - ./frontend:/app
      - incos-frontend-node-modules-dev:/app/node_modules
      - incos-static-images-dev:/app/public/static/images

  nginx:
    image: nginx:alpine
    container_name: incos-workspace-nginx-dev
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "6173:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/friendly-50x.html:/usr/share/nginx/html/friendly-50x.html:ro
      - incos-static-images-dev:/var/www/incos-static/images:ro

volumes:
  incos-postgres-data-dev:
  incos-data-protection-keys-dev:
  incos-nuget-cache-dev:
  incos-frontend-node-modules-dev:
  incos-static-images-dev:
