services:
  postgres:
    image: postgres:18
    container_name: canvas-to-do-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: incos_workspace
      POSTGRES_USER: incos
      # Local-only fallback; production requires an explicit password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incos123}
    ports:
      - "127.0.0.1:6060:5432"
    volumes:
      - incos-postgres-data-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incos -d incos_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/CanvasToDo.Api/Dockerfile.dev
    container_name: canvas-to-do-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6272
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__CanvasToDo: Host=postgres;Port=5432;Database=incos_workspace;Username=incos;Password=${POSTGRES_PASSWORD:-incos123}
      Database__EnsureCreated: "true"
      Database__MigrateAuth: "true"
      ReverseProxy__TrustForwardedHeaders: "true"
      Authentication__Admin__BootstrapEmail: ${AUTH_ADMIN_BOOTSTRAP_EMAIL:-}
      Authentication__Admin__BootstrapPassword: ${AUTH_ADMIN_BOOTSTRAP_PASSWORD:-}
      Authentication__Admin__BootstrapDisplayName: ${AUTH_ADMIN_BOOTSTRAP_DISPLAY_NAME:-Administrator}
      Authentication__SessionHours: ${AUTH_SESSION_HOURS:-336}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Google__CallbackPath: /api/auth/google/oauth-callback
      Authentication__Facebook__ClientId: ${FACEBOOK_CLIENT_ID:-}
      Authentication__Facebook__ClientSecret: ${FACEBOOK_CLIENT_SECRET:-}
      Authentication__Facebook__CallbackPath: /api/auth/facebook/oauth-callback
      Email__PublicFrontendBaseUrl: ${PUBLIC_FRONTEND_BASE_URL:-http://localhost:6173}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Canvas To Do}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__Smtp__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-15}
      Email__Development__ExposeTokens: ${EMAIL_DEVELOPMENT_EXPOSE_TOKENS:-false}
      Authentication__Canvas__AllowedInstanceUrls: ${CANVAS_ALLOWED_INSTANCE_URLS:-https://sfu.instructure.com,https://canvas.ubc.ca,https://canvas.usask.ca,https://canvas.uw.edu,https://canvas.stanford.edu,https://canvas.harvard.edu,https://q.utoronto.ca,https://bruinlearn.ucla.edu,https://bcourses.berkeley.edu,https://canvas.it.umich.edu,https://canvas.illinois.edu,https://canvas.umn.edu,https://canvas.virginia.edu,https://canvas.colorado.edu,https://canvas.upenn.edu,https://login.canvas.cornell.edu,https://etl.snu.ac.kr,https://lms.korea.ac.kr,https://icampus.skku.edu,https://canvas.suwon.ac.kr}
      Authentication__Canvas__OAuth__Enabled: ${CANVAS_OAUTH_ENABLED:-false}
      Authentication__Canvas__OAuth__ClientId: ${CANVAS_OAUTH_CLIENT_ID:-}
      Authentication__Canvas__OAuth__ClientSecret: ${CANVAS_OAUTH_CLIENT_SECRET:-}
      Authentication__Canvas__OAuth__CallbackUrl: ${CANVAS_OAUTH_CALLBACK_URL:-http://localhost:6173/api/canvas/oauth/callback}
      Authentication__Canvas__ManualTokenEnabled: ${CANVAS_MANUAL_TOKEN_ENABLED:-true}
      # Keep this key path and volume: existing sessions and Canvas tokens depend on it.
      DataProtection__KeysPath: /var/lib/canvas-to-do/data-protection-keys
    ports:
      - "127.0.0.1:6272:6272"
    volumes:
      - .:/workspace
      - incos-data-protection-keys-dev:/var/lib/canvas-to-do/data-protection-keys
      - canvas-to-do-nuget-cache-dev:/root/.nuget/packages

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: canvas-to-do-frontend-dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:6272
    volumes:
      - ./frontend:/app
      - canvas-to-do-frontend-node-modules-dev:/app/node_modules

  nginx:
    image: nginx:alpine
    container_name: canvas-to-do-nginx-dev
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "6173:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/friendly-50x.html:/usr/share/nginx/html/friendly-50x.html:ro

volumes:
  # Keep persistent volume keys stable so deployments reuse their database and key ring.
  incos-postgres-data-dev:
  incos-data-protection-keys-dev:
  canvas-to-do-nuget-cache-dev:
  canvas-to-do-frontend-node-modules-dev:
