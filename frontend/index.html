<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/canvas-to-do-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="application-name" content="Canvas To Do" />
    <meta name="apple-mobile-web-app-title" content="Canvas To Do" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#08285c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas To Do</title>
    <script>
      (() => {
        // Preserve legacy preference keys so the product rename does not reset user settings.
        const storedTheme = localStorage.getItem('canvas-to-do-theme')
          ?? localStorage.getItem('incos-workspace-theme');
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        const storedLanguage = localStorage.getItem('canvas-to-do-language')
          ?? localStorage.getItem('incos-workspace-language');
        const language = storedLanguage === 'ko' ? 'ko' : 'en';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
