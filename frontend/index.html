<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/incos-workspace-tab-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/incos-workspace-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="INCOS Workspace" />
    <meta name="apple-mobile-web-app-title" content="INCOS Workspace" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffdc00" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INCOS Workspace</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem('incos-workspace-theme');
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        const storedLanguage = localStorage.getItem('incos-workspace-language');
        const language = storedLanguage === 'ko' ? 'ko' : 'en';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
