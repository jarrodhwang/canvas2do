map $http_x_forwarded_for $canvas_to_do_client_ip {
  "" $remote_addr;
  ~^\s*(?<canvas_forwarded_client>[^,\s]+)\s*$ $canvas_forwarded_client;
  default $remote_addr;
}

server {
  listen 6173;
  server_name _;
  client_max_body_size 1m;
  client_header_buffer_size 4k;
  large_client_header_buffers 8 16k;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = / {
    return 308 /canvas-to-do/;
  }

  location = /canvas-to-do {
    return 308 /canvas-to-do/;
  }

  location /canvas-to-do/api/ {
    proxy_pass http://api:6272/api/;
    proxy_http_version 1.1;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $canvas_to_do_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /canvas-to-do;
  }

  location /api/ {
    proxy_pass http://api:6272/api/;
    proxy_http_version 1.1;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $canvas_to_do_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /canvas-to-do;
  }

  location /canvas-to-do/ {
    rewrite ^/canvas-to-do/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

}
