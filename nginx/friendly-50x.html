<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace Temporarily Unavailable</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f3ed;
        color: #201f1c;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid rgba(32, 31, 28, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        padding: 28px;
        box-shadow: 0 18px 50px rgba(32, 31, 28, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 12px 0 0;
        color: #69645c;
        font-size: 15px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        margin-top: 22px;
        min-height: 38px;
        border-radius: 8px;
        background: #8a5a00;
        color: #fff;
        padding: 0 14px;
        text-decoration: none;
        font-weight: 800;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #171612;
          color: #f5f1e8;
        }

        main {
          border-color: rgba(245, 241, 232, 0.14);
          background: rgba(31, 29, 24, 0.9);
          box-shadow: none;
        }

        p {
          color: #bdb6a8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Workspace is temporarily unavailable</h1>
      <p>
        The app server is starting, restarting, or briefly unreachable. Give it a moment,
        then try again.
      </p>
      <a href="/">Reload workspace</a>
    </main>
  </body>
</html>
